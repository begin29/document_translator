[project]
name = "stark-translator"
version = "0.1.0"
description = "Stark Future document translation service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "tiktoken>=0.8",
  "pypdfium2>=4.30",
  "pypdf>=5.1",
  "reportlab>=4.2",
  "python-docx>=1.1",
  "pillow>=11.0",
  "numpy>=2.1",
  "httpx>=0.28",
  "openai>=1.55",
  "openai-agents>=0.0.19",
  "mcp>=1.2,<2",
  "python-multipart>=0.0.17",
  "pyyaml>=6.0",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "redis>=5.0",
  "uvloop",
]

[project.optional-dependencies]
otel = ["opentelemetry-exporter-otlp-proto-http>=1.28"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "fakeredis>=2.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
