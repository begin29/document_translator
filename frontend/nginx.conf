server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api:8000;
  }
  location /health {
    proxy_pass http://api:8000;
  }
  location /ready {
    proxy_pass http://api:8000;
  }
  location /metrics {
    proxy_pass http://api:8000;
  }
  location / {
    try_files $uri /index.html;
  }
}
